spring.application.name=crediflow-ai

# API acessivel apenas neste computador
server.address=127.0.0.1
server.port=8081

# Modelo local: sem chave de API e sem provedor pago
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.chat.think=true
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.num-ctx=1024
spring.ai.ollama.chat.num-predict=512

# Usa somente modelos previamente baixados
spring.ai.ollama.init.pull-model-strategy=never

# Nao precisamos de embeddings nesta etapa
spring.ai.model.embedding=none

# Evita expor detalhes internos em respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never

# Nao habilitar logs de prompts e respostas
logging.level.org.springframework.ai=INFO

spring.datasource.url=jdbc:h2:file:./dados-locais/crediflow
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.ai.retry.max-attempts=1
